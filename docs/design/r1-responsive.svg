</g>
<rect x="24" y="580" width="672" height="152" rx="4" class=""/>
<text x="40" y="608" class="">Below minimum — alternative at 79 × 19</text>
<text x="40" y="642" class="">Resize to at least 80 × 20. Current: 79 × 19.</text>
<text x="40" y="670" class="">Draft and audio preserved; hidden input is inactive.</text>
<text x="40" y="698" class="">q requests quit; unsaved draft requires confirmation.</text>
