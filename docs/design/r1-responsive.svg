<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" xml:space="preserve" role="img" aria-labelledby="title desc">
<title id="title">R1 — Minimum 80 by 20 and below-minimum alternative</title>
<desc id="desc">An exact 80-column 20-row ASCII wireframe: 13 content rows hold a bounded 76 by 11 editor, then five player rows and two status/hint rows. Separate below-minimum alternative preserves the hidden draft and audio.</desc>
<style>
rect { fill: #161a20; stroke: #75808e; stroke-width: 1.5; }
text { fill: #e7e9ee; font-family: 'Iosevka Slab', monospace; font-size: 16px; }
.heading { font-size: 20px; font-weight: bold; }
.muted { fill: #b0b9c7; }
.focus { stroke: #8bd5ca; stroke-width: 3; }
.selected { fill: #303d4b; stroke: none; }
.accent { fill: #8bd5ca; }
.flow { fill: none; stroke: #b0b9c7; stroke-width: 2; marker-end: url(#arrow); }
</style>
<rect width="720" height="790" style="fill:#101318;stroke:none"/>
<text x="24" y="34" class="heading">R1  MINIMUM 80 × 20 / MODAL FIT</text>
<text x="24" y="62" class="muted">Plain mode · exactly 80 columns × 20 rows below</text>
<g id="minimum-grid">
