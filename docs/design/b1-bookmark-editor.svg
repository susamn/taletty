<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" xml:space="preserve" role="img" aria-labelledby="title desc">
<title id="title">B1 — Capture a paused book and retain a failed-save draft</title>
<desc id="desc">Library highlights Rivers, but lowercase b captures paused Orchard at 00:18:40. Editor freezes book, chapter and timestamp; optional two-second pre-roll gives jump position 00:18:38. Failed save keeps the draft and focus.</desc>
<style>
rect { fill: #161a20; stroke: #75808e; stroke-width: 1.5; }
text { fill: #e7e9ee; font-family: 'Iosevka Slab', monospace; font-size: 16px; }
.heading { font-size: 20px; font-weight: bold; }
.muted { fill: #b0b9c7; }
.focus { stroke: #8bd5ca; stroke-width: 3; }
.selected { fill: #303d4b; stroke: none; }
.accent { fill: #8bd5ca; }
.flow { fill: none; stroke: #b0b9c7; stroke-width: 2; marker-end: url(#arrow); }
</style>
<rect width="1320" height="820" style="fill:#101318;stroke:none"/>
<text x="24" y="34" class="heading">B1  CAPTURE / NOTE EDITOR</text>
<text x="24" y="60" class="muted">144 × 42 candidate · b captures current audio, not the highlighted library book</text>
<g opacity="0.25"><rect x="24" y="86" width="212" height="478" rx="4" class=""/>
<text x="38" y="111" class="">1 Library</text>
