<text x="660" y="674" text-anchor="middle">Speed 1.25× · Volume 70%</text>
<text x="1280" y="674" text-anchor="end">Sleep: Off</text>

<text x="24" y="738" class="muted">ACTIVITY  Bookmark not saved · no success message until storage confirms</text>
<text x="24" y="770" class="">EDITOR OWNS INPUT  Space, b/B, q and pane numbers are text, never global shortcuts</text>
<text x="24" y="800" class="muted">Playing may continue during other captures; paused audio remains paused. No automatic retargeting.</text>
</svg>
