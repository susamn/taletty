<text x="40" y="420" class="">Bookmarks</text>
<text x="40" y="448" class="">Settings / Help</text>
<rect x="236" y="86" width="690" height="294" rx="4" class="focus"/>
<text x="250" y="111" class="accent">2 Books [FOCUS] — All books</text>
<text x="252" y="148" class="muted">TITLE / AUTHOR                       PROGRESS   LOCAL STATE</text>
<text x="252" y="188" class="">  The Glass Orchard  [PAUSED]          5%       Ready</text>
<text x="272" y="214" class="muted">Mara Vale</text>
<rect x="244" y="231" width="674" height="64" class="selected"/>
<text x="252" y="254" class="">&gt; ★ A Map of Quiet Rivers              0%       Ready</text>
<text x="272" y="280" class="accent">Ilan Reed</text>
<text x="252" y="326" class="">  The Lantern Atlas                    —        Not downloaded</text>
<rect x="236" y="380" width="690" height="184" rx="4" class=""/>
<text x="250" y="405" class="">3 Details — A Map of Quiet Rivers</text>
<text x="252" y="438" class="">★ Favorite  ·  Ilan Reed  ·  Narrated by Noor Bell</text>
<text x="252" y="466" class="">8h 00m  ·  Ready locally  ·  Not started</text>
<text x="252" y="494" class="">Actions: Play this book / Unfavorite / Manage bookmarks</text>
<rect x="926" y="86" width="370" height="478" rx="4" class=""/>
<text x="940" y="111" class="">4 Chapters — Rivers</text>
<text x="942" y="154" class="">  01  A folded map          20m</text>
<text x="942" y="182" class="">  02  The ferry            32m</text>
<text x="942" y="210" class="">  03  Quiet water          25m</text>
<text x="942" y="238" class="">  04  Beyond the bend      28m</text>
<text x="942" y="364" class="">Audio is still Orchard.</text>
<text x="942" y="392" class="">Chapter activation here</text>
<text x="942" y="420" class="">switches books explicitly.</text>
<text x="942" y="448" class="">Not a seek in Orchard.</text>
</g>
<rect x="284" y="118" width="752" height="414" rx="4" class="focus"/>
<text x="300" y="146" class="accent">Add bookmark — The Glass Orchard [EDITOR]</text>
<text x="300" y="186" class="">Captured while paused: 00:18:40 · Ch 02 Across the gate</text>
<text x="300" y="214" class="">Jump position: 00:18:38 · pre-roll 2s (clamped at zero)</text>
<text x="300" y="242" class="">Book, chapter and time stay fixed while you type.</text>
<rect x="300" y="264" width="720" height="116" rx="4" class=""/>
<text x="316" y="292" class="">Note</text>
<text x="316" y="326" class="">The gate opens, but the promise remains unanswered.</text>
<text x="316" y="354" class="">Return to this passage when the narrator reveals why.|</text>
<text x="300" y="420" class="accent">Save failed: storage unavailable. Your draft is still here.</text>
<text x="300" y="458" class="">[Retry save]  [Cancel]</text>
<text x="300" y="498" class="muted">Enter / Ctrl+S save · Alt+Enter newline · Esc cancel</text>
