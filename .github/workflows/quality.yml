name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ADAPTER_DIR: engine/connectors/audible/internal/bridge/adapter

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-tooling:
    name: Coverage tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.inventory.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate and discover coverage target inventory
        id: inventory
        run: python tools/check_inventory.py --root . >> "$GITHUB_OUTPUT"
      - name: Install pinned test tooling
        run: |
          python -m pip install -r tools/requirements.txt
          python --version
          python -m coverage --version
      - name: Compile and test validator with branch reporting
        run: |
          python -m compileall -q tools tests/tooling
          python -m coverage run --branch --source=tools -m unittest discover -s tests/tooling -v
          python -m coverage report -m
          mkdir -p coverage
          python -m coverage json -o coverage/tooling.json
      - name: Execute app-owned SQLite schema contract
        run: python tests/storage/test_schema.py
      - name: Enforce exact independent statement threshold
        run: python tools/coverage_gate.py --require tooling --python tooling=coverage/tooling.json
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-tooling
          path: coverage/tooling.json
          if-no-files-found: warn
          retention-days: 7

  python-adapter:
    name: Python adapter (3.12)
    needs: coverage-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install explicit test-only runtime dependencies
        run: |
          bash .github/scripts/install-ci-media.sh
          python -m pip install -r tools/requirements.txt -r "$ADAPTER_DIR/requirements.txt"
      - name: Independently measure all adapter source
        env:
          TALETTY_REQUIRE_MEDIA_TOOLS: '1'
        run: |
          python -m compileall -q "$ADAPTER_DIR" tests/adapter
          python -m coverage run --branch --source="$ADAPTER_DIR" -m unittest discover -s tests/adapter -v
          python -m coverage report -m
          mkdir -p coverage
          python -m coverage json -o coverage/adapter.json
          python tools/check_inventory.py --root . --adapter-report coverage/adapter.json
          python tools/coverage_gate.py --require adapter --python adapter=coverage/adapter.json
      - name: Upload independent adapter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-adapter
          path: coverage/adapter.json
          if-no-files-found: warn
          retention-days: 7

  module-coverage:
    name: Go ${{ matrix.module }} (${{ matrix.go }})
    needs: coverage-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.coverage-tooling.outputs.modules) }}
        go: ['1.26.x', '1.27.x']
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.module == 'engine'
        with:
          python-version: '3.12'
      - name: Install actual Go-Python contract dependencies
        if: matrix.module == 'engine'
        run: |
          bash ../.github/scripts/install-ci-media.sh
          python -m pip install -r "../$ADAPTER_DIR/requirements.txt"
          echo 'TALETTY_REQUIRE_MEDIA_TOOLS=1' >> "$GITHUB_ENV"
      - name: Check formatting and module consistency
        run: |
          go version
          test -z "$(gofmt -l .)"
          go mod tidy -diff
      - name: Vet and build independently
        run: |
          go vet ./...
          go build ./...
      - name: Race-test all production packages with fresh coverage
        run: |
          mkdir -p ../coverage
          go test -count=1 -race -timeout=60s -covermode=atomic -coverpkg=./... -coverprofile=../coverage/${{ matrix.module }}.out ./...
          go tool cover -func=../coverage/${{ matrix.module }}.out
      - name: Repeat real controlling-PTY shell journeys
        if: matrix.module == 'app'
        run: go test -count=3 -race -timeout=60s -run '^TestControllingTerminalJourney$' -v ./internal/ui
      - name: Repeat private licensed composition process journeys
        if: matrix.module == 'engine'
        run: go test -count=3 -race -timeout=60s -run '^TestComposition' -v ./connectors/audible
      - name: Enforce independent statement threshold
        run: python3 ../tools/coverage_gate.py --require ${{ matrix.module }} --go ${{ matrix.module }}=../coverage/${{ matrix.module }}.out
      - name: Upload module coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.go }}
          path: coverage/${{ matrix.module }}.out
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: Quality gate
    if: always()
    needs: [coverage-tooling, module-coverage, python-adapter]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every real quality job to succeed
        env:
          TOOLING_RESULT: ${{ needs.coverage-tooling.result }}
          MODULE_RESULT: ${{ needs.module-coverage.result }}
          ADAPTER_RESULT: ${{ needs.python-adapter.result }}
        run: |
          test "$TOOLING_RESULT" = success
          test "$MODULE_RESULT" = success
          test "$ADAPTER_RESULT" = success
